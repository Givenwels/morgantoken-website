<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Morgan ClawBench 本地模型评测快照">
    <title>Morgan ClawBench · 模型评测</title>
    <link rel="stylesheet" href="/morgan-content.css">
  </head>
  <body data-collection="bench" data-source="/migrated/bench/data.json">
    <a class="skip-link" href="#main">跳到主要内容</a>
    <header class="site-header">
      <a class="wordmark" href="/">Morgan</a>
      <nav aria-label="主导航">
        <a href="/">首页</a>
        <a href="/projects">项目</a>
        <a href="/about">关于</a>
      </nav>
    </header>

    <main id="main">
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">Independent data browser</p>
        <h1 id="page-title">Morgan ClawBench</h1>
        <p class="intro">迁移快照包含 102 个任务和 70 个模型。以下数据完全来自本站保存的本地快照。</p>
      </section>

      <p id="loading-status" class="status" role="status">正在加载评测数据…</p>
      <p id="error-status" class="status status-error" role="alert" hidden></p>

      <section aria-labelledby="summary-title">
        <h2 id="summary-title">快照摘要</h2>
        <div id="summary-cards" class="summary-grid"></div>
      </section>

      <section aria-labelledby="leaderboard-title">
        <div class="section-heading">
          <h2 id="leaderboard-title">模型排行榜</h2>
          <p>分数越高越好</p>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th scope="col">排名</th>
                <th scope="col">模型</th>
                <th scope="col">提供方</th>
                <th scope="col">最终得分</th>
                <th scope="col">综合得分</th>
                <th scope="col">效率</th>
              </tr>
            </thead>
            <tbody id="leaderboard-body"></tbody>
          </table>
        </div>
      </section>
    </main>

    <footer>Local snapshot · Morgan</footer>
    <script type="module" src="/morgan-content.js"></script>
  </body>
</html>
